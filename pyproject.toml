[project]
name = "dispycanoe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyspark>=4.0.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.34.0",
    "pytest>=8.4.0",
    "requests>=2.32.3",
    "ruff>=0.11.13",
]

[tool.setuptools]
packages = ["dispycanoe"]

[tool.poe.tasks]
test = "pytest tests/"
get-data = "python scripts/download_test_data.py"
