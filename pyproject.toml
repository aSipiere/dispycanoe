[project]
name = "dispycanoe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.0",
    "numpy>=2.2.6",
    "pmtiles>=3.4.1",
    "poethepoet>=0.34.0",
    "pyarrow>=20.0.0",
    "pyspark>=4.0.0",
    "shapely>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.11.12",
]

[tool.poe.tasks]
test = { shell = "export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 && pytest tests/ -v" }
test-builder = { shell = "export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 && pytest tests/test_builder.py -v" }
test-cov = { shell = "export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 && pytest tests/ --cov=dispycanoe" }
format = { shell = "ruff check . --fix"}

[tool.setuptools]
packages = ["dispycanoe"]